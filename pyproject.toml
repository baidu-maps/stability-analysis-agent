# 构建系统配置
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stability-analyzer"
version = "1.0.0"
description = "Stability Analysis Agent: AI-assisted crash log analysis toolchain (CLI, daemon, analyzers, agent)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "liuhong_cd", email = "liuhong_cd@users.noreply.github.com" }
]
keywords = ["crash", "analyzer", "agent"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10"
]
dependencies = [
    "build>=1.0.3",
    "openai"
]

[project.optional-dependencies]
test = ["pytest", "mock"]

[project.urls]
Homepage = "https://github.com/baidu-maps/stability-analysis-agent"
Changelog = "CHANGELOG.md"

# 项目根目录平铺结构：agent/ tools/ rag/ skills/ daemon/ tool_system/ protocol/ prompts/ cli/ 均为顶级子包
# pip install -e . 后可直接 from agent.xxx / from tools.xxx 等导入
[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "rag", "skills", "daemon", "tool_system", "protocol", "prompts", "cli"]
output-dir = "output/dist"

[tool.hatch.build.targets.sdist]
output-dir = "output/dist"
