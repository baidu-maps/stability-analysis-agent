# 构建系统配置
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stability-analysis-agent"
version = "1.1.0"
description = "Stability Analysis Agent: AI-assisted crash log analysis toolchain (CLI, daemon, analyzers, agent)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "liuhong_cd", email = "liuhong_cd@users.noreply.github.com" }
]
keywords = ["crash-analysis", "crash-log", "ai-agent", "addr2line", "symbolication", "langgraph", "rag", "stability", "debugging", "root-cause-analysis"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10"
]
dependencies = [
    "openai",
    "requests",
    "langgraph",
    "langchain",
    "langchain-openai",
    "numpy",
    "sentence-transformers",
    "chromadb",
    "chroma-hnswlib",
    "posthog",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages"
]

[project.optional-dependencies]
test = ["pytest", "mock"]

[project.scripts]
sa-agent = "cli.main:main"
sa = "cli.main:main"

[project.urls]
Homepage = "https://github.com/baidu-maps/stability-analysis-agent"
Changelog = "https://github.com/baidu-maps/stability-analysis-agent/blob/main/CHANGELOG.md"

# 项目根目录平铺结构：agent/ tools/ rag/ workflows/ daemon/ tool_system/ protocol/ prompts/ cli/ 均为顶级子包
# pip install -e . 后可直接 from agent.xxx / from tools.xxx 等导入
[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "rag", "workflows", "daemon", "tool_system", "protocol", "prompts", "cli"]
output-dir = "output/dist"

[tool.hatch.build.targets.sdist]
output-dir = "output/dist"
