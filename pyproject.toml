# 构建系统配置
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stability-analysis-agent"
version = "1.2.9"
description = "Agent framework that builds evidence chains from Crash/ANR/OOM logs, auto-fixes Crash code, and plugs into test verification & bug trackers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "liuhong_cd", email = "liuhong_cd@users.noreply.github.com" }
]
keywords = ["crash-analysis", "crash-log", "ai-agent", "addr2line", "symbolication", "langgraph", "rag", "stability", "debugging", "root-cause-analysis"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "certifi",
    "openai",
    "requests",
    "langgraph",
    "langchain",
    "langchain-openai",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages",
    "ripgrep>=14.0",
]

[project.optional-dependencies]
# 向量库 / 相似案例检索（ChromaDB + 可选 SentenceTransformer 嵌入）
# 版本区间与 torch/transformers/numpy ABI 对齐，避免 pip 解析出 torch 2.2 + numpy 2.x + 新 transformers 的组合
rag = [
    "numpy>=1.24,<2",
    "chromadb>=0.4",
    "chroma-hnswlib",
    "posthog",
    "torch>=2.4.0",
    "transformers>=4.36.0,<4.52.0",
    "sentence-transformers>=2.2.2,<3.0.0",
    "accelerate>=0.26.0",
]
test = ["pytest", "mock"]

[project.scripts]
sa-agent = "cli.main:main"
sa = "cli.main:main"

[project.urls]
Homepage = "https://github.com/baidu-maps/stability-analysis-agent"
Changelog = "https://github.com/baidu-maps/stability-analysis-agent/blob/main/CHANGELOG.md"

# 项目根目录平铺结构：agent/ tools/ rag/ workflows/ daemon/ tool_system/ protocol/ prompts/ cli/ 均为顶级子包
# pip install -e . 后可直接 from agent.xxx / from tools.xxx 等导入
[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "rag", "workflows", "daemon", "tool_system", "skill_system", "protocol", "prompts", "cli", "services"]
output-dir = "output/dist"

# Ship example templates next to the cli package (never include *.local.json secrets)
[tool.hatch.build.targets.wheel.force-include]
"configs/agent_config.local.example.json" = "cli/configs/agent_config.local.example.json"
"configs/add2line_resolver_config.local.example.json" = "cli/configs/add2line_resolver_config.local.example.json"

[tool.hatch.build.targets.sdist]
output-dir = "output/dist"
