name: Publish PyPI

# Separate from ci.yml: only builds/uploads on tag or manual dispatch.
# Local equivalent: scripts/pypi_release/build_python_dist.sh + publish_pypi.sh
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Upload target"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      skip_tests:
        description: "Skip deterministic suite (emergency only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deterministic:
    name: Gate — deterministic suite
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (core + test extras)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Pre-commit deterministic suite
        run: |
          python -B -m unittest \
            test.ai_regression.test_runner \
            test.cli.test_report_paths \
            test.cli.test_vector_db_commit_prompt \
            test.rag.test_case_writer \
            test.daemon.test_build_cli_cmd \
            test.daemon.test_skills_api \
            test.daemon.test_run_lifecycle \
            test.daemon.test_vector_db_commit_api \
            test.daemon.test_web_preferences \
            test.skill_system.test_installed_skills_runtime \
            test.web.test_web_contract \
            -v

  build:
    name: Build wheel / sdist
    needs: [deterministic]
    if: ${{ always() && (needs.deterministic.result == 'success' || needs.deterministic.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.meta.outputs.package_version }}
      publish_target: ${{ steps.meta.outputs.publish_target }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve version and target
        id: meta
        run: |
          PKG_VERSION="$(python -c "import pathlib,re; t=pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); m=re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', t); assert m, 'version missing'; print(m.group(1))")"
          echo "package_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
          else
            TARGET="pypi"
          fi
          echo "publish_target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${PKG_VERSION}"
          echo "Publish target: ${TARGET}"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            TAG_VERSION="${TAG#v}"
            if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
              echo "ERROR: git tag '${TAG}' does not match pyproject.toml version '${PKG_VERSION}'."
              echo "Bump version in pyproject.toml, commit, then tag v${PKG_VERSION}."
              exit 1
            fi
          fi

      - name: Build distributions
        run: bash scripts/pypi_release/build_python_dist.sh

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ steps.meta.outputs.package_version }}
          path: output/pypi_dist/*
          if-no-files-found: error

  publish:
    name: Upload to ${{ needs.build.outputs.publish_target }}
    needs: [build]
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.publish_target }}
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist-${{ needs.build.outputs.package_version }}
          path: output/pypi_dist

      - name: Publish package (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: output/pypi_dist/
          repository-url: ${{ needs.build.outputs.publish_target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
          verbose: true
          # Prefer OIDC Trusted Publishing. Token fallback (optional):
          # 1) Add secret PYPI_API_TOKEN or TEST_PYPI_API_TOKEN
          # 2) Uncomment the next line
          # password: ${{ needs.build.outputs.publish_target == 'testpypi' && secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
